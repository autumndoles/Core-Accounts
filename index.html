<div class="logo">

<h1>Core Games</h1>

<p class="subtitle">

<!-- LOGIN -->

<div id="loginSection">

    <h2>Log In</h2>

    <div class="form-section">

        <label for="loginUsername">
            Username
        </label>

        <input
            id="loginUsername"
            type="text"
            maxlength="20"
            placeholder="Enter your username"
            autocomplete="username"
        >

        <label for="loginPassword">
            Password
        </label>

        <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
        >

        <button onclick="login()">
            Log In
        </button>

    </div>

    <div
        id="loginMessage"
        class="message"
    ></div>

    <div class="divider">
        OR
    </div>

    <button
        class="secondary-button"
        onclick="showRegister()"
    >
        Create a Core Games Account
    </button>

</div>

<!-- REGISTER -->

<div
    id="registerSection"
    class="hidden"
>

    <h2>Create Account</h2>

    <div class="form-section">

        <label for="registerUsername">
            Username
        </label>

        <input
            id="registerUsername"
            type="text"
            maxlength="20"
            placeholder="Choose a username"
            autocomplete="username"
        >

        <label for="registerPassword">

            id="registerPassword"

</div>

<script>

/* =========================================================
   SCREEN SWITCHING
========================================================= */

function showRegister() {

    document
        .getElementById("loginSection")
        .classList.add("hidden");

    document
        .getElementById("registerSection")
        .classList.remove("hidden");

    clearMessages();

}

function showLogin() {

    document
        .getElementById("registerSection")
        .classList.add("hidden");

    document
        .getElementById("loginSection")
        .classList.remove("hidden");

    clearMessages();

}

/* =========================================================
   MESSAGES
========================================================= */

function showMessage(
    elementId,
    message,
    type
) {

    const element =
        document.getElementById(
            elementId
        );

    element.innerText =
        message;

    element.className =
        `message ${type}`;

    element.style.display =
        "block";

}

function clearMessages() {

    [
        "loginMessage",
        "registerMessage"
    ].forEach(id => {

        const element =
            document.getElementById(id);

        element.innerText =
            "";

        element.style.display =
            "none";

    });

}

/* =========================================================
   LOGIN
========================================================= */

function login() {

    const username =
        document
            .getElementById(
                "loginUsername"
            )
            .value
            .trim();

    const password =
        document
            .getElementById(
                "loginPassword"
            )
            .value;

    if (!username) {

        showMessage(
            "loginMessage",
            "Please enter your username.",
            "error"
        );

        return;

    }

    if (!password) {

        showMessage(
            "loginMessage",
            "Please enter your password.",
            "error"
        );

        return;

    }

    /*
        Account authentication will
        be connected to the Core Games
        account server here.
    */

    showMessage(
        "loginMessage",
        "The account server is not connected yet.",
        "error"
    );

}

/* =========================================================
   REGISTER
========================================================= */

function register() {

    const username =
        document
            .getElementById(
                "registerUsername"
            )
            .value
            .trim();

    const password =
        document
            .getElementById(
                "registerPassword"
            )
            .value;

    const confirmPassword =
        document
            .getElementById(
                "registerConfirmPassword"
            )
            .value;

    if (!username) {

        showMessage(
            "registerMessage",
            "Please choose a username.",
            "error"
        );

        return;

    }

    if (username.length < 3) {

        showMessage(
            "registerMessage",
            "Username must be at least 3 characters.",
            "error"
        );

        return;

    }

    if (!password) {

        showMessage(
            "registerMessage",
            "Please create a password.",
            "error"
        );

        return;

    }

    if (password.length < 8) {

        showMessage(
            "registerMessage",
            "Password must be at least 8 characters.",
            "error"
        );

        return;

    }

    if (
        password !==
        confirmPassword
    ) {

        showMessage(
            "registerMessage",
            "Passwords do not match.",
            "error"
        );

        return;

    }

    /*
        Account creation will
        be connected to the Core Games
        account server here.
    */

    showMessage(
        "registerMessage",
        "The account server is not connected yet.",
        "error"
    );

}

</script>
